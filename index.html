<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu blog pessoal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho Principal -->
    <header class="header">
        <h1>Meu blog pessoal</h1>
        <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
    </header>

    <!-- Conteúdo Principal / Post -->
    <main class="container">
        <article class="post">
            <!-- Ícone/Imagem lateral -->
            <div class="post-icon">
                <img src="imagem-logo" alt="Ícone do Post">
            </div>

            <!-- Conteúdo do Post -->
            <div class="post-content">
                <h2>Meu primeiro post</h2>
                <p class="author">Por: Professora Ana Paula</p>
                <p class="text">
                    Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.
                </p>
                
                <!-- Botão/Contador de Curtidas -->
                <button class="like-btn">
                    <span class="heart">♥</span> 0
                </button>
            </div>
        </article>
    </main>

</body>
</html>
